[package]
name = "odyssey1e"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "odyssey1e_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than native-tls: one fewer system dependency on Windows,
# and it is what will still build when this targets Android.
rand = "0.8"
# Hashing the fast-login PIN. Pure Rust, no system dependency, builds
# for Android - the same reasons rustls was chosen over native-tls.
sha2 = "0.10"
# rustls-tls-NATIVE-ROOTS, not plain rustls-tls. rustls stays, for the
# reasons given above; what changes is whose list of trusted roots it
# reads.
#
# WHY, AND IT IS NOT A PREFERENCE. `rustls-tls` bundles webpki-roots - a
# copy of Mozilla's root list compiled into the binary - and ignores the
# operating system's store entirely. Any antivirus that inspects HTTPS
# does it by standing in the middle with its own certificate, signed by
# a root it installs into WINDOWS. curl, the browser and every other
# program on the machine read that store, find the root and carry on;
# this app read Mozilla's list instead, did not recognise the
# certificate, and the handshake failed.
#
# IT FAILS AS `error sending request for url` WITH NO HTTP STATUS, which
# is the part that misleads. There is no 401 and no 403 - nothing to
# suggest a certificate is involved - and it reads exactly like the
# network being down. It was diagnosed only by noticing that curl and
# PowerShell reached the same URL from the same shell while the app
# could not. Avast's Web Shield (wsc_proxy) is what was doing it here.
#
# THE REASON IT MATTERS BEYOND ONE LAPTOP: a player running any
# inspecting antivirus hits the same wall, and the app looks broken to
# them and fine to everyone else. Reading the system store is what every
# other desktop program does.
#
# Android is unaffected: rustls-native-certs reads the system store
# there too, so the portability argument above still holds.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
