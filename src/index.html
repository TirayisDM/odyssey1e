<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <title>odyssey1e — access test rig</title>
  <script type="module" src="/main.js" defer></script>
</head>
<body>
<div class="app">

  <header>
    <strong>odyssey1e</strong>
    <span id="who" class="muted">not signed in</span>
    <button id="signout" class="ghost" hidden>sign out</button>
  </header>

  <div class="cols">
    <div class="left">

      <section id="unlock-panel" hidden>
        <h2>Unlock <span id="unlock-who" class="muted"></span></h2>
        <div class="row">
          <input id="pin" type="password" inputmode="numeric" maxlength="4"
                 placeholder="4-digit PIN" autocomplete="off" class="narrow" />
          <button id="do-unlock">Unlock</button>
          <button id="use-password" class="ghost">Use password</button>
        </div>
        <div id="unlock-msg" class="dm-msg" hidden></div>
      </section>

      <section id="auth-panel">
        <h2>Account</h2>
        <input id="email" type="email" placeholder="tirayis.dm+p1@gmail.com" autocomplete="off" />
        <input id="password" type="password" placeholder="password" autocomplete="off" />
        <input id="display" type="text" placeholder="display name (sign-up only)" autocomplete="off" />
        <div class="row">
          <button id="signin">Sign in</button>
          <button id="signup" class="ghost">Sign up</button>
        </div>
        <div id="pin-setup" hidden>
          <div class="row">
            <input id="new-pin" type="password" inputmode="numeric" maxlength="4"
                   placeholder="set a 4-digit PIN" autocomplete="off" class="narrow" />
            <button id="save-pin" class="ghost">Save PIN</button>
            <button id="clear-pin" class="ghost">Forget PIN</button>
          </div>
          <div class="muted pin-note">Convenience, not security &mdash; see pin.rs.</div>
        </div>
      </section>

      <section>
        <h2>Games <button id="refresh-games" class="tiny ghost">refresh</button></h2>
        <ul id="games" class="list"></ul>
        <input id="game-name" placeholder="new game name" />
        <button id="create-game">Create game</button>
        <input id="join-code" placeholder="join code" />
        <button id="join-game" class="ghost">Join by code</button>
      </section>

      <section>
        <h2>Characters</h2>
        <ul id="characters" class="list"></ul>
        <input id="char-name" placeholder="character name" />
        <button id="create-char">Create character</button>
      </section>

      <section id="sheet-panel" hidden>
        <h2>Sheet <span id="sheet-who" class="muted"></span></h2>
        <div class="row">
          <input id="level" type="number" min="1" max="20" placeholder="level" />
          <button id="save-level" class="ghost">Set level</button>
        </div>
        <div id="abilities" class="abils"></div>
        <div id="skills" class="list"></div>
      </section>

      <section id="equipment-panel" hidden>
        <h2>Equipment <button id="check-keys" class="tiny ghost">check keys</button></h2>
        <div id="equip-profs" class="muted trained"></div>
        <ul id="inventory" class="list"></ul>
      </section>

      <section id="dm-panel" hidden>
        <h2>DM <span id="dm-who" class="muted"></span></h2>

        <div class="row">
          <input id="enc-name" placeholder="new encounter name" />
          <button id="create-encounter" class="ghost">Create</button>
        </div>
        <div id="dm-msg" class="dm-msg" hidden></div>
        <ul id="encounters" class="list"></ul>

        <div id="enc-detail" hidden>
          <div id="enc-editing" class="editing" hidden></div>
          <div class="sub">Enrol</div>
          <select id="enrol-what"></select>
          <input id="enrol-name" placeholder="name (blank = auto, e.g. Goblin 0003)" />
          <button id="enrol">Enrol</button>
          <ul id="roster" class="list"></ul>

          <div class="sub">Challenge</div>
          <div class="row">
            <input id="chal-label" placeholder="the iron lock" />
            <input id="chal-dc" type="number" min="1" placeholder="DC" class="narrow" />
          </div>
          <select id="chal-skill"></select>
          <button id="add-challenge" class="ghost">Add challenge</button>
          <ul id="challenges" class="list"></ul>

          <div class="sub">Statblock</div>
          <div class="row">
            <input id="npc-name" placeholder="name, e.g. Goblin Archer" />
            <input id="npc-key" placeholder="key" />
          </div>
          <div class="row">
            <input id="npc-species" placeholder="species (optional)" />
            <input id="npc-class" placeholder="class (optional)" />
          </div>
          <div class="row">
            <input id="npc-ac" type="number" min="0" placeholder="AC" />
            <input id="npc-hp" type="number" min="1" placeholder="HP" />
          </div>
          <button id="create-npc" class="ghost">Write statblock</button>
        </div>
      </section>

      <section>
        <h2>Rolls</h2>
        <div class="row">
          <input id="named-request" placeholder="insight, wis save, ath…" />
          <select id="mode">
            <option value="normal">Normal</option>
            <option value="adv">Adv</option>
            <option value="dis">Dis</option>
          </select>
        </div>
        <!-- Optional. "no target" means the roll is not judged at
             all, which is not the same as failing it. The list is the
             active encounter's actors and challenges; typing a number
             by hand still works when there is no encounter. -->
        <div class="row">
          <select id="target-pick">
            <option value="">no target</option>
            <option value="manual">type a number…</option>
          </select>
          <!-- Only for something that is down. A dying creature saves on
               its own turn; until initiative exists, that is this. -->
          <button id="death-save" class="ghost" hidden>death save</button>
        </div>
        <div class="row" id="manual-target" hidden>
          <select id="target-kind">
            <option value="dc">vs DC</option>
            <option value="ac">vs AC</option>
          </select>
          <input id="target-value" type="number" placeholder="15" />
          <input id="target-label" placeholder="Goblin 1 (optional)" />
        </div>
        <div id="preview" class="preview muted">—</div>
        <button id="roll-named">Roll</button>
        <input id="roll-request" placeholder="request, e.g. insight" />
        <input id="roll-formula" placeholder="formula, e.g. 2d20kh1+5 (blank = pending)" />
        <button id="create-roll">Insert roll</button>
        <input id="patch-narr" placeholder="narrative to patch into newest roll" />
        <button id="patch-roll" class="ghost">Patch narrative</button>
        <ul id="rolls" class="list"></ul>
      </section>

    </div>

    <div class="right">
      <h2>Log <button id="clear-log" class="tiny ghost">clear</button></h2>
      <div id="log"></div>
    </div>
  </div>

</div>
</body>
</html>
